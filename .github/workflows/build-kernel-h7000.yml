name: build-kernel-h7000
on:
  push:
    paths:
      - ".github/workflows/build-kernel-h7000.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm python3 perl curl git make g++ flex bison m4 \
            libssl-dev zlib1g-dev libxml2-dev xz-utils uuid-dev zstd unzip libncurses-dev
          echo "--- toolchain ---"; clang --version | head -2; lld --version | head -1
      - name: theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos" || echo "theos clone failed"
          mkdir -p "$HOME/theos/sdks"
          curl -sL -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks || true
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks" || true
          ls "$HOME/theos/tools" 2>/dev/null | head -5 || true
      - name: config
        run: |
          chmod +x xnu/*.sh xnu-deps/*.sh xnu-build.sh tools/*.py 2>/dev/null || true
          make h7000_defconfig DEVICE=h7000 2>&1 | tail -30
      - name: apply
        run: |
          set -o pipefail
          xnu/apply.sh 2>&1 | tail -40
      - name: deps-setup
        run: |
          xnu-deps/setup.sh 2>&1 | tail -60
      - name: build
        continue-on-error: true
        run: |
          ./xnu-build.sh -j"$(nproc)" -k 2>&1 | tail -200
          echo "=== kernel? ==="
          ls -la hakios-kernel 2>/dev/null || ls -la xnu-src/*/BUILD/obj/*/ 2>/dev/null | tail -20 || true
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-kernel
          path: |
            hakios-kernel
            xnu-src/**/BUILD/obj/**/mach.*.unstripped
          if-no-files-found: warn