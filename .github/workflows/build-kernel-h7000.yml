name: build-kernel-h7000
on:
  push:
    paths:
      - ".github/workflows/build-kernel-h7000.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl git libxml2 \
            libncurses-dev libtinfo6 xz-utils unzip zstd uuid-dev libbsd-dev pkg-config autoconf automake libtool lld llvm clang bison flex m4 zlib1g-dev libssl-dev python3
          clang --version | head -2
      - name: theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          ARCH=$(uname -m)
          echo "ARCH=$ARCH"
          mkdir -p "$THEOS/toolchain"
          curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$ARCH.tar.xz" | tar -xJ -C "$THEOS/toolchain/"
          ls "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -10 || true
          mkdir -p "$THEOS/sdks"
          curl -sL -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/" || ls /tmp/sdks/sdks-master | head
          ls "$THEOS/sdks"
      - name: config
        run: |
          chmod +x xnu/*.sh xnu-deps/*.sh xnu-build.sh tools/*.py 2>/dev/null || true
          make h7000_defconfig DEVICE=h7000 2>&1 | tail -30
      - name: apply
        run: xnu/apply.sh 2>&1 | tail -30
      - name: deps-setup
        run: xnu-deps/setup.sh 2>&1 | tail -80
      - name: build
        continue-on-error: true
        run: |
          ./xnu-build.sh -j"$(nproc)" -k 2>&1 | tail -250
          echo "=== kernel ==="
          ls -la hakios-kernel 2>/dev/null || true
          find . -name 'mach.*.unstripped' -o -name 'mach.development*' 2>/dev/null | head -20
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-kernel
          path: |
            hakios-kernel
            xnu-src/**/BUILD/obj/**/mach.*
          if-no-files-found: warn